name: xmake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    
    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev pkg-config

    - name: Cache xmake packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.xmake
          ${{ github.workspace }}/.xmake
        key: xmake-${{ matrix.os }}-${{ hashFiles('xmake.lua') }}

    - name: Configure
      run: xmake f -y -m release

    - name: Build
      run: xmake -y -v

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: snake3d-${{ matrix.os }}
        path: build/
